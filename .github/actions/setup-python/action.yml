name: Set up Python checks
description: Install locked dependencies and optionally build the native backend once.

inputs:
  python-version:
    description: Python version to install.
    default: "3.14"
  extras:
    description: Space-separated optional dependency groups.
    default: "dev plot"
  build-native:
    description: Whether to build and install the Rust extension.
    default: "true"

runs:
  using: composite
  steps:
    - name: Install uv and Python
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: "0.12.7"
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install locked dependencies
      shell: bash
      env:
        DEPENDENCY_EXTRAS: ${{ inputs.extras }}
      run: |
        read -r -a extras <<< "$DEPENDENCY_EXTRAS"
        args=()
        for extra in "${extras[@]}"; do
          args+=(--extra "$extra")
        done
        uv sync --locked --no-install-project "${args[@]}"

    - name: Install Rust
      if: inputs.build-native == 'true'
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

    - name: Cache Rust build
      if: inputs.build-native == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-python-${{ inputs.python-version }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-cargo-python-${{ inputs.python-version }}-

    - name: Build native backend
      if: inputs.build-native == 'true'
      shell: bash
      run: uv run --no-sync maturin develop --release --locked --uv
