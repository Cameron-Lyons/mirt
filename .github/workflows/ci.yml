name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install verified actionlint
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Validate all workflows
        run: '"$RUNNER_TEMP/actionlint" -color'

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.14"
      - name: Run ruff check
        run: uv run --no-sync ruff check src/ tests/ benchmarks/
      - name: Run ruff format check
        run: uv run --no-sync ruff format --check src/ tests/ benchmarks/

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.14"
      - name: Run mypy
        run: uv run --no-sync mypy src/mirt --ignore-missing-imports

  build-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.11"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build release wheel with locked Rust dependencies
        run: uv run --no-sync maturin build --release --locked --out dist
      - name: Upload wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: ci-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  test:
    needs: build-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-wheel
          path: dist
      - name: Install wheel without resolving dependencies
        run: uv pip install --no-deps --no-index dist/*.whl
      - name: Require the Rust extension
        run: uv run --no-sync python -c "from mirt import mirt_rs; from mirt._rust_backend import RUST_AVAILABLE; assert RUST_AVAILABLE"
      - name: Run tests against the installed wheel
        run: uv run --no-sync pytest tests/ --strict-config --strict-markers -m 'not slow and not performance' --cov=mirt --cov-report=xml
      - name: Upload coverage report
        if: always() && matrix.python-version == '3.14'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14
      - name: Upload coverage
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  numpy:
    name: NumPy fallback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.14"
      - name: Require a Python-only environment
        run: uv run --no-sync python -c "from mirt._rust_backend import RUST_AVAILABLE; assert not RUST_AVAILABLE"
      - name: Run fallback tests
        run: |
          uv run --no-sync pytest \
            tests/test_backend*.py \
            tests/test_rust_backend_fallback_vectorized.py \
            tests/test_rust_backend_plausible.py \
            tests/test_scoring/ \
            tests/test_estimation/test_em.py \
            tests/test_models/test_dichotomous.py \
            tests/test_models/test_polytomous.py \
            tests/test_models/test_multidimensional.py \
            tests/test_simulation_chunking.py \
            tests/test_polytomous_simulation.py \
            tests/test_response_validation_regressions.py \
            --strict-config --strict-markers -m 'not slow and not performance'

  performance:
    name: Performance Smoke Tests
    needs: build-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.14"
      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-wheel
          path: dist
      - name: Install wheel without resolving dependencies
        run: uv pip install --no-deps --no-index dist/*.whl
      - name: Require the Rust extension
        run: uv run --no-sync python -c "from mirt import mirt_rs; from mirt._rust_backend import RUST_AVAILABLE; assert RUST_AVAILABLE"
      - name: Run performance regression smoke tests
        env:
          MIRT_IMPORT_THRESHOLD_SECONDS: "2.5"
          MIRT_FIT_THRESHOLD_SECONDS: "12.0"
          MIRT_SCORE_THRESHOLD_SECONDS: "4.0"
        run: uv run --no-sync pytest tests/test_performance_smoke.py --strict-config --strict-markers
      - name: Record structured scoring benchmark
        run: |
          uv run --no-sync python benchmarks/run_benchmarks.py \
            --suite scoring --persons 2000 --items 30 \
            --repeats 3 --warmups 1 --json benchmark-report.json
      - name: Upload benchmark report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v6
        with:
          name: benchmark-report-${{ github.sha }}
          path: benchmark-report.json
          if-no-files-found: error
          retention-days: 30

  slow-tests:
    name: Slow Test Suite
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.14"
      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-wheel
          path: dist
      - name: Install wheel without resolving dependencies
        run: uv pip install --no-deps --no-index dist/*.whl
      - name: Require the Rust extension
        run: uv run --no-sync python -c "from mirt import mirt_rs; from mirt._rust_backend import RUST_AVAILABLE; assert RUST_AVAILABLE"
      - name: Run slow tests
        run: uv run --no-sync pytest tests/ --strict-config --strict-markers -m slow

  complete:
    name: CI complete
    if: always()
    needs: [workflow-lint, lint, typecheck, build-wheel, test, numpy, performance, slow-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all expected checks to pass
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
          REQUIRE_SLOW: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          checks = json.loads(os.environ["CHECK_RESULTS"])
          failures = []
          for name, check in checks.items():
              result = check["result"]
              if name == "slow-tests" and os.environ["REQUIRE_SLOW"] != "true":
                  if result == "skipped":
                      continue
              if result != "success":
                  failures.append(f"{name}: {result}")
          if failures:
              sys.exit("Required CI checks did not pass: " + ", ".join(failures))
          print("All required CI checks passed.")
          PY
