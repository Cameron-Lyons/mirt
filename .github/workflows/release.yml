name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  MPLBACKEND: Agg
  PYTHONHASHSEED: "0"

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist --compatibility pypi
          sccache: "true"
          manylinux: "2014"

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          args: --release --locked --out dist --compatibility pypi
          sccache: "true"

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheels-windows-x64
          path: dist
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist --compatibility pypi
          sccache: "true"

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wheels-sdist
          path: dist
          if-no-files-found: error

  test-wheels:
    name: Test Wheels
    needs: [linux, windows, macos]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: wheels-linux-x86_64
            python-version: "3.11"
          - os: ubuntu-latest
            artifact: wheels-linux-x86_64
            python-version: "3.12"
          - os: ubuntu-latest
            artifact: wheels-linux-x86_64
            python-version: "3.13"
          - os: ubuntu-latest
            artifact: wheels-linux-x86_64
            python-version: "3.14"
          - os: ubuntu-24.04-arm
            artifact: wheels-linux-aarch64
            python-version: "3.12"
          - os: windows-latest
            artifact: wheels-windows-x64
            python-version: "3.12"
          - os: macos-latest
            artifact: wheels-macos-aarch64
            python-version: "3.12"
          - os: macos-15-intel
            artifact: wheels-macos-x86_64
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Install wheel without resolving dependencies
        run: uv pip install --no-deps --no-index dist/*.whl

      - name: Require the native backend and matching package versions
        run: uv run --no-sync python -c "import mirt; from importlib.metadata import version; from mirt import mirt_rs; from mirt._rust_backend import RUST_AVAILABLE; assert RUST_AVAILABLE; assert version('mirt') == mirt.__version__, 'Distribution and runtime versions must match'"

      - name: Run tests against the installed wheel
        run: uv run --no-sync pytest tests/ -m 'not slow and not performance' --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-tests-${{ matrix.artifact }}-python-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: error
          retention-days: 14

  test-sdist:
    name: Test Source Distribution
    needs: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.14"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Download source distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: wheels-sdist
          path: dist

      - name: Build wheel from the source distribution
        env:
          UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist" --strip-components=1
          uv run --directory "$RUNNER_TEMP/sdist" --no-sync maturin build \
            --release --locked --out "$GITHUB_WORKSPACE/dist"

      - name: Install rebuilt wheel without resolving dependencies
        run: uv pip install --no-deps --no-index dist/*.whl

      - name: Require the native backend and matching package versions
        run: uv run --no-sync python -c "import mirt; from importlib.metadata import version; from mirt import mirt_rs; from mirt._rust_backend import RUST_AVAILABLE; assert RUST_AVAILABLE; assert version('mirt') == mirt.__version__, 'Distribution and runtime versions must match'"

      - name: Run tests against the rebuilt wheel
        run: uv run --no-sync pytest tests/ -m 'not slow and not performance' --junitxml=test-results-sdist.xml

      - name: Upload source distribution test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-tests-sdist
          path: test-results-sdist.xml
          if-no-files-found: error
          retention-days: 14

  verify-artifacts:
    name: Verify Release Artifacts
    needs: [linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.14"
          extras: dev

      - name: Require distribution metadata to match the release version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: uv run --no-sync python .github/scripts/check_release_artifacts.py dist --tag "$RELEASE_TAG"

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-wheels, test-sdist, verify-artifacts]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1
        with:
          egress-policy: audit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List distribution files
        run: ls -la dist/

      - name: Generate artifact attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
