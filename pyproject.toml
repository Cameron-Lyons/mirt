[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "src"
module-name = "mirt.mirt_rs"
bindings = "pyo3"

[project]
name = "mirt"
dynamic = ["version"]
description = "Multidimensional Item Response Theory for Python"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Cameron Lyons", email = "cameron@cameronlyons.com"}
]
keywords = [
    "item response theory",
    "IRT",
    "psychometrics",
    "educational measurement",
    "latent trait models",
    "Rasch",
    "graded response model",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.9",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
polars = ["polars>=0.20"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "ty==0.0.110",
    "pandas>=1.5",
    "polars>=0.20",
    "maturin>=1.4",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]
plot = [
    "matplotlib>=3.10.8",
]
gpu = [
    "torch>=2.0",
    "fsspec>=2026.6.0",
]

[project.urls]
Homepage = "https://github.com/Cameron-Lyons/mirt"
Documentation = "https://cameron-lyons.github.io/mirt/"
Repository = "https://github.com/Cameron-Lyons/mirt"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-config --strict-markers -m 'not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "performance: marks performance regression smoke tests",
]
filterwarnings = [
    "error::pytest.PytestDeprecationWarning",
]

[tool.coverage.paths]
mirt = ["src/mirt", "*/site-packages/mirt"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B904", "B905", "ANN0", "ANN2"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/mirt/__init__.py" = ["F401"]
"!src/mirt/**" = ["ANN"]

# Require complete signatures once a package function has any annotations.
[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = true
mypy-init-return = true

[tool.ty.src]
include = ["src/mirt"]

[tool.ty.environment]
python-version = "3.11"

# Numerical modules use gradual typing. The backend contracts and public
# result types are checked with the full set of default rules.
[[tool.ty.overrides]]
include = ["src/mirt/**"]
exclude = [
    "src/mirt/exceptions.py",
    "src/mirt/results/**",
    "src/mirt/_backend_config.py",
    "src/mirt/_backend_state.py",
    "src/mirt/backends/rust/_helpers.py",
]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-explicit-return = "ignore"
invalid-assignment = "ignore"
missing-attribute = "ignore"
missing-union-attribute = "ignore"
not-subscriptable = "ignore"

[[tool.ty.overrides]]
include = ["src/mirt/estimation/**", "src/mirt/models/**", "src/mirt/utils/**"]
[tool.ty.overrides.rules]
unsupported-operator = "ignore"

[[tool.ty.overrides]]
include = ["src/mirt/estimation/**", "src/mirt/models/**"]
[tool.ty.overrides.rules]
incompatible-method-override = "ignore"

[[tool.ty.overrides]]
include = [
    "src/mirt/models/explanatory.py",
    "src/mirt/models/mixed_format.py",
    "src/mirt/models/testlet.py",
]
[tool.ty.overrides.rules]
incompatible-property-override = "ignore"
