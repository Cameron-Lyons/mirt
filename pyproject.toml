[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "src"
module-name = "mirt.mirt_rs"
bindings = "pyo3"

[project]
name = "mirt"
dynamic = ["version"]
description = "Multidimensional Item Response Theory for Python"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Cameron Lyons", email = "cameron@cameronlyons.com"}
]
keywords = [
    "item response theory",
    "IRT",
    "psychometrics",
    "educational measurement",
    "latent trait models",
    "Rasch",
    "graded response model",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.9",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]
polars = ["polars>=0.20"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pandas>=1.5",
    "polars>=0.20",
    "maturin>=1.4",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]
plot = [
    "matplotlib>=3.10.8",
]
gpu = [
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/Cameron-Lyons/mirt"
Documentation = "https://cameron-lyons.github.io/mirt/"
Repository = "https://github.com/Cameron-Lyons/mirt"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "performance: marks performance regression smoke tests",
]
filterwarnings = [
    "error::pytest.PytestDeprecationWarning",
]

[tool.coverage.report]
fail_under = 59

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B904", "B905"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/mirt/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_ignores = true
check_untyped_defs = true
disallow_incomplete_defs = true
disable_error_code = [
    "import-not-found",
    "import-untyped",
    "arg-type",
    "return-value",
    "assignment",
    "union-attr",
    "attr-defined",
    "override",
    "operator",
    "index",
    "dict-item",
    "list-item",
]

[[tool.mypy.overrides]]
module = [
    "mirt.exceptions",
    "mirt.results.*",
    "mirt._backend_config",
    "mirt._backend_state",
    "mirt.backends.rust._helpers",
]
disable_error_code = [
    "import-not-found",
    "import-untyped",
    "assignment",
    "union-attr",
    "attr-defined",
    "override",
    "operator",
    "index",
    "dict-item",
    "list-item",
]
