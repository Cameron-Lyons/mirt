[package]
name = "mirt_rs"
version = "1.1.0"
edition = "2024"
description = "High-performance Rust backend for MIRT (Multidimensional Item Response Theory)"
license = "MIT"

[lib]
name = "mirt_rs"
crate-type = ["cdylib"]
path = "rust_src/src/lib.rs"

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py311"] }
numpy = "0.29.0"
ndarray = "0.17.2"
rayon = "1.12.0"
rand = { version = "0.10.1", default-features = false, features = ["std", "std_rng"] }
libm = "0.2.16"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
